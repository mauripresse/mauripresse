<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalogue — Tous nos produits d'impression · Mauri Presse</title>
<meta name="description" content="Tout le catalogue Mauri Presse : cartes de visite, flyers, affiches, étiquettes, vinyle adhésif, roll-up, signalétique, reprographie et packaging.">
<link rel="icon" href="https://mauripresse.com/images/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="site-header"></div>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>

<main>
  <section class="pagehead pagehead--plain"><div class="wrap">
    <nav class="crumbs" aria-label="Fil d'Ariane"><a href="index.html">Accueil</a><span>/</span><span>Catalogue</span></nav>
    <h1>Que voulez-vous <span class="h-accent">imprimer ?</span></h1>
    <p>Choisissez une famille, ou cherchez directement un produit.</p>

    <div class="cbar">
      <div class="cbar__search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <label class="sr" for="filter">Chercher un produit</label>
        <input id="filter" type="search" placeholder="Ex. : étiquettes, flyer A5, vitrine…" autocomplete="off">
        <button type="button" id="clear" class="cbar__clear" aria-label="Effacer la recherche" hidden>✕</button>
      </div>
      <label class="cbar__x"><input type="checkbox" id="express"><span>⚡ Express 24h</span></label>
    </div>
  </div></section>

  <!-- Vue par défaut : les 14 familles -->
  <section class="section section--tight" id="view-families"><div class="wrap">
    <div class="fams" id="fams"></div>
  </div></section>

  <!-- Vue recherche : les produits trouvés -->
  <section class="section section--tight" id="view-results" hidden><div class="wrap">
    <div class="rhead"><h2 id="r-title"></h2><button type="button" class="btn btn--ghost btn--sm" id="back">← Toutes les familles</button></div>
    <div class="rlist" id="rlist"></div>
    <div class="cempty" id="noresult" hidden>
      <h2>Aucun produit trouvé.</h2>
      <p>Nous imprimons aussi sur mesure : décrivez-nous votre projet, l'équipe vous répond avec un prix et un délai.</p>
      <div class="hero__cta"><a class="btn" href="contact.html">Demander un devis <span class="arrow">→</span></a></div>
    </div>
  </div></section>
</main>

<script>
(() => {
  const params = new URLSearchParams(location.search);
  const filter = document.getElementById("filter"), express = document.getElementById("express"), clear = document.getElementById("clear");
  const norm = (s) => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");

  /* Familles */
  document.getElementById("fams").innerHTML = CATS.map((c, i) => {
    const conf = c.items.some((it) => typeof it !== "string");
    return `<a class="fam t${(i % 4) + 1}" href="categorie.html?c=${c.id}">
      <span class="fam__ico">${catIcon(c.id)}</span>
      <div class="fam__txt">
        <h2>${esc(c.name)}</h2>
        <p>${esc(c.blurb)}</p>
      </div>
      <div class="fam__foot"><span>${c.items.length} produit${c.items.length > 1 ? "s" : ""}</span>${conf ? '<span class="pill">24h</span>' : ""}<span class="fam__go">→</span></div>
    </a>`;
  }).join("");

  /* Produits (pour la recherche) */
  const ALL = CATS.flatMap((c) => c.items.map((it) => ({ it, c, conf: typeof it !== "string", s: norm(itemName(it) + " " + c.name) })));
  const row = (x) => `<a class="rrow" href="${itemHref(x.it)}">
      <span class="rrow__ico">${catIcon(x.c.id)}</span>
      <div><h3>${esc(itemName(x.it))}</h3><p>${esc(x.c.name)}</p></div>
      ${x.conf ? `<span class="rrow__p">dès <b>${eur(computePrice(x.it.p, 0, [x.it.o || 0], "std"))}</b> HT <span class="pill">24h</span></span>` : `<span class="rrow__p"><span class="pill pill--soft">Sur devis →</span></span>`}
    </a>`;

  function apply() {
    const q = norm(filter.value.trim()), x = express.checked, active = !!q || x;
    clear.hidden = !q;
    document.getElementById("view-families").hidden = active;
    document.getElementById("view-results").hidden = !active;
    if (!active) return;
    const words = q.split(/\s+/).filter(Boolean);
    const hits = ALL.filter((p) => words.every((w) => p.s.includes(w)) && (!x || p.conf));
    document.getElementById("r-title").textContent = hits.length + " produit" + (hits.length > 1 ? "s" : "") + (x && !q ? " disponibles en express 24h" : " trouvé" + (hits.length > 1 ? "s" : ""));
    document.getElementById("rlist").innerHTML = hits.map(row).join("");
    document.getElementById("noresult").hidden = hits.length > 0;
  }
  filter.value = params.get("q") || "";
  express.checked = params.get("express") === "1";
  filter.addEventListener("input", apply);
  express.addEventListener("change", apply);
  clear.addEventListener("click", () => { filter.value = ""; apply(); filter.focus(); });
  document.getElementById("back").addEventListener("click", () => { filter.value = ""; express.checked = false; apply(); });
  apply();
})();
</script>
</body>
</html>
